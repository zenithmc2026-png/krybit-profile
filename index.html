<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krybit</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<canvas id="snow"></canvas>
<div class="cursor-glow"></div>
<div class="grid"></div>

<div class="container">

<img class="avatar"
src="https://avatars.githubusercontent.com/u/9919?v=4">

<h1>Krybit</h1>

<p class="bio">
Developer • Discord Seller • Creator
</p>

<div class="badges">
<span>🔥 Trusted</span>
<span>⚡ Fast Delivery</span>
<span>💎 Premium</span>
</div>

<div class="links">

<a href="#">
<i class="fab fa-discord"></i>
Discord
</a>

<a href="#">
<i class="fab fa-instagram"></i>
Instagram
</a>

<a href="#">
<i class="fab fa-github"></i>
GitHub
</a>

<a href="#">
<i class="fab fa-youtube"></i>
YouTube
</a>

</div>

<div class="music-card">

<h3>🎵 Apple Music</h3>

<iframe
allow="autoplay *; encrypted-media *;"
frameborder="0"
height="175"
style="width:100%;max-width:660px;overflow:hidden;border-radius:14px;"
sandbox="allow-forms allow-popups allow-same-origin allow-scripts allow-top-navigation-by-user-activation"
src="https://embed.music.apple.com/in/album/freedom-single/1010891982">
</iframe>

</div>

<div class="discord-card">

<div class="status"></div>

<div>
<h3>Discord Status</h3>
<p>Online • Building cool stuff</p>
</div>

</div>

</div>

<script src="script.js"></script>

</html>
